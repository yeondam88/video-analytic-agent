[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    slow: mark test as slow running
    integration: mark test as integration test
    api: mark test as API test

# Test discovery
norecursedirs = .* build dist CVS _darcs {arch} *.egg venv env virtualenv

# Test execution
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --durations=5
    -p no:warnings

# Environment variables
env =
    ENVIRONMENT=test
    LOG_LEVEL=DEBUG

# Coverage settings
[coverage:run]
source = src
omit = 
    tests/*
    */__init__.py
    */migrations/*
    */alembic/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError

[coverage:html]
directory = coverage_html 